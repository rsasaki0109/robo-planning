[package]
name = "robo-planning"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Motion planning algorithms organised by robot type and task: grid search, sampling-based, nonholonomic, arm, local planning and trajectory generation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rsasaki0109/robot-planning"

[lib]
name = "robo_planning"

[dependencies]
tiny-skia = { version = "0.11", optional = true, default-features = false, features = ["std", "simd"] }
gif = { version = "0.13", optional = true }

[profile.release]
debug = false

[features]
default = []
# Raster rendering and animated GIF output (adds tiny-skia and gif).
render = ["dep:tiny-skia", "dep:gif"]

[[example]]
name = "task_gallery"
required-features = ["render"]
